name: cafeteria-local

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Usa npm run db:up}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Usa npm run db:up}
      POSTGRES_DB: cafeteria
      TZ: UTC
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1
          -U "$$POSTGRES_USER" -d cafeteria_test -tAc 'SELECT 1' >/dev/null
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  postgres_data:
