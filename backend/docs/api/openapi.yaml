        Universo: Product.deletedAt IS NULL; categoría existente con Category.isActive=true
        y Category.deletedAt IS NULL; Product.createdAt < to (cohorte). Product.isAvailable
        NO filtra: un producto agotado sigue existiendo y se devuelve con isAvailable=false.
        Product no tiene isActive y no se inventa. El estado de deletedAt/categoría/nombre/
        isAvailable es el actual al generar la respuesta; no existe snapshot histórico y
        no se reconstruye el estado al instante to. universe.asOf es to y expresa el corte
        de cohorte (Product.createdAt < to) con atributos actuales, no la hora de los
        atributos mutables ni un snapshot de deletedAt/categoría; la UI futura debe
        etiquetarlo como «corte del universo», no como histórico. universe.definition incluye
