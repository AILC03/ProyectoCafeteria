          type: object
          additionalProperties: false
          properties:
            customerNumber:
              type: string
              pattern: ^C[0-9]{6,19}$
              description: 'ADR0011: C + identity mínimo seis dígitos; nunca Number ni CLI-.'
            name:
              type: string
              minLength: 1
              maxLength: 120
            phone:
              type: string
              pattern: ^\+52[0-9]{10}$
          required:
