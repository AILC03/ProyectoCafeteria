    TicketCustomerRegistration:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          writeOnly: true
          description:
            Original de 32 bytes base64url emitido por CASH-02; no enviar qrPayload ni su prefijo.
            No se descifra el ticket ni se acepta token de pago/ticket digital.
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Nombre en un campo, trim; no controles ASCII.
        phone:
          type: string
          pattern: ^(\+52[0-9]{10}|[0-9]{10})$
          description:
            Teléfono MX tras trim, sin separadores; se normaliza a +52 y debe ser único incluso en
            cuentas inactivas.
        pin:
          type: string
          pattern: ^[0-9]{4}$
          writeOnly: true
          description: NIP string de cuatro dígitos; conserva ceros. Hash Argon2id con la política de auth.
      required:
