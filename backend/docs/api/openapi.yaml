        string propio de este DTO y no se reutiliza el parser genérico Page/pageQuerySchema
        (limit entero 1–100). cursor opcional, opaco, base64url, 1–2048; vincula definición,
        periodo normalizado, método, límite y última clave (name,productId); manipulado, de
        otro endpoint o incompatible produce 400. El cursor y page.nextCursor requieren un
        codificador/decodificador propio con alcance dashboard-no-movement; no se reutiliza
        decodeCursor de pagination.ts (scopes de filtros y posición {id,createdAt}). Se
        rechazan extras (category, top, metric, direction,
        timeZone, order, sort, offset, page, includeUnavailable…), repetidos, arrays,
        vacíos y body no vacío. No hay filtro de categoría en esta capacidad.
        Orden determinista: name COLLATE "C" ASC y productId numérico ASC. El frontend no
        reordena. Paginación por keyset, sin offset ni top N; se piden limit+1 filas para
        decidir nextCursor; nextCursor null al final. totalNoMovementProducts es el total del
        conjunto sin movimiento que cumple universo+rango+método, antes del cursor y la
        paginación; no es el tamaño de página ni el total de productos activos del
        catálogo. Cada página es una lectura actual: si el catálogo cambia entre páginas
        (renombrado, baja, cambio de categoría, desactivación o baja de categoría), puede
        omitir/duplicar elementos y el total puede variar; generatedAt no es token de
        snapshot y no hay snapshot entre páginas. En catálogo estable, las páginas
        concilian con totalNoMovementProducts.
        DTO cerrado: generatedAt/currency/period/method/universe{asOf,definition,
        includesUnavailable}/totalNoMovementProducts/page{limit,nextCursor}/items
        {productId,name,category{id,name},isAvailable,createdAt}. IDs y conteos son
