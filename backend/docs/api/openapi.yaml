        FORBIDDEN para cualquier rol distinto de ADMINISTRADOR (incluido GERENTE)/
        PIN_CHANGE_REQUIRED/ORIGIN_NOT_ALLOWED, 413 PAYLOAD_TOO_LARGE, 429 RATE_LIMITED,
        500 INTERNAL_ERROR y 503 DEPENDENCY_UNAVAILABLE solo para fallos reconocidos. Sin
        CSRF nuevo para esta lectura ni ampliación de permisos de /api/v1/sales. Sin CSV
