            - name
            - phone
      required:
        - customer
  securitySchemes:
    guestTicketHeader:
      type: apiKey
      in: header
      name: X-Ticket-Token
      description: Permiso opaco exclusivo al comprobante; no JWT ni token de registro/cobro.
    accessCookie:
      type: apiKey
      in: cookie
      name: caf_access
      description: 'Desarrollo: JWT HttpOnly, máximo 15 min. No Bearer.'
    productionAccessCookie:
      type: apiKey
      in: cookie
      name: __Host-caf_access
      description: 'Producción: Secure, HttpOnly, Path=/, host-only.'
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Token de GET /auth/csrf o login/refresh; coincide con cookie HttpOnly firmada y
        requiere Origin exacto.
    checkoutToken:
      type: apiKey
      in: header
      name: X-Checkout-Token
