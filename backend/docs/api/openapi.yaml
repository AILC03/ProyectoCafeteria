        semiabierto [from,to) y método opcional. Agrupa por Product.categoryId ACTUAL:
        no existe snapshot histórico de categoría en la línea ni en el producto, por lo
        que una venta antigua aparece en la categoría actual del producto. Si el producto
        cambió de categoría, todo su historial del rango se agrupa en la categoría nueva
        y el total no cambia; la UI futura debe advertirlo de forma visible y no presentar
        el resultado como «categoría al momento de la venta». Unidades = suma de
        OrderItem.quantity; importe = suma del histórico OrderItem.lineTotalCents, no el
        precio actual. OrderItemOption ya está incluido en lineTotalCents y no se une;
        Refund no resta ni borra la venta; no se unen intentos, eventos ni incidentes.
        La fuente Sale implica pago exitoso: igual que D11 de E2-04, no se aplica por
        defecto p.status='SUCCEEDED'. Se agrega el conjunto completo, sin top N, sin
        paginación, sin cursor ni N+1. Product.deletedAt e isAvailable no filtran; las
        líneas históricas de productos con baja lógica/no disponibles se incluyen para
        conciliar. Una categoría con movimiento se incluye aunque Category.isActive sea
        false y se devuelve isActive; no se filtra por categoría activa porque rompería
        la conciliación. Una categoría con deletedAt no nulo o una línea sin
        producto/categoría resoluble es un fallo interno explícito y saneado, no una
        categoría ficticia ni una omisión silenciosa: la baja de categoría exige cero
        productos (BR-CAT-005) y la FK Restrict impide el resto.
        Entrada estricta: from/to obligatorios, UTC reales terminados en Z, 0–3
        decimales, from inclusivo y to exclusivo, from < to, mínimo
        2000-01-01T08:00:00.000Z y rango máximo 366 días absolutos; 400 sin truncar.
        metric=units|amount obligatoria y sin default; method opcional CASH|STRIPE,
        omitido incluye ambos y devuelve null. No existe filtro de categoría: enviar
        category/categoryId u otro extra devuelve 400. Se rechazan extras, repetidos,
        arrays, valores vacíos y body no vacío.
        DTO cerrado: generatedAt/currency/period/method/metric/denominator
        {unitsSold,totalCents}/totalCategories/items{categoryId,name,isActive,unitsSold,
        totalCents,sharePercent}. denominator describe el conjunto completo; con el
        mismo rango/método y dataset estable concilia con el resumen completo. Se
        devuelven todas las categorías con movimiento, sin relleno de ceros ni fila
        «otras»; totalCategories es la longitud de items. Orden: métrica seleccionada
        descendente, name COLLATE "C" ascendente y categoryId numérico ascendente; el
        frontend no reordena. sharePercent lo calcula el backend con aritmética entera
        exacta y redondeo half-up, como string de exactamente dos decimales sobre la
        métrica seleccionada; con base cero e ítems devuelve "0.00" y la UI debe mostrar
        «sin base» usando denominator, no interpretar 0.00 como participación. La suma
        de porcentajes redondeados no se fuerza a 100.00 ni se reasigna: cada porcentaje
        se desvía hasta 0.005 puntos y el residuo es hasta 0.005 × n puntos
        porcentuales (cota inclusiva). Cero líneas produce 200 con items vacío,
        denominadores "0" y totalCategories "0", no 404. IDs, unidades, importes,
        conteos y porcentajes son strings exactos; sin Number, PII ni datos de pago.
        generatedAt no es token de snapshot. Cache-Control no-store y Referrer-Policy
        no-referrer dentro del
        middleware privado; la integración de E2-13 verificó su cobertura en rechazos
        globales previos (Origin/parsing, 413/429) con el orden de middleware actual.
        Errores application/problem+json saneados: 400 VALIDATION_ERROR, 401
        UNAUTHENTICATED, 403 FORBIDDEN para cualquier rol distinto de ADMINISTRADOR
