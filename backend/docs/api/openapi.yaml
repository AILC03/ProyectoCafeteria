        en el backend por TASK-DA-E2-05. El esquema aceptado no cambia; UI y CSV siguen
        fuera de esta implementación.
        Solo ADMINISTRADOR con sesión
        vigente. Ranking de productos con movimiento sobre ventas pagadas brutas del periodo
        UTC semiabierto [from,to) y método opcional. La fuente Sale implica pago exitoso; el
        contrato aceptado no aplica por defecto un filtro defensivo p.status='SUCCEEDED'
        (D11 aceptada sin filtro por defecto; su adopción futura requiere decisión propia:
        si se adopta, aplicar el mismo predicado en resumen y /api/v1/sales/summary y
        probarlo con una fila inconsistente). Agrupa por productId,
        nunca por nombre.
        Unidades = suma de OrderItem.quantity; importe = suma del histórico
        OrderItem.lineTotalCents, no el precio actual. OrderItemOption ya está incluido en
        lineTotalCents y no se une; refunds no restan y no se une Refund. Se agrega el
        conjunto completo filtrado antes de recortar a top N, sin N+1 ni páginas de
        /api/v1/sales. La resolución de nombres, incluido el snapshot de bajas, usa una sola
        lectura/CTE o LATERAL, nunca una consulta por producto, y su coste se mide en E2-05.
        Entradas escalares únicas y estrictas: from/to UTC reales con 0–3 decimales y mínimo
        aceptado 2000-01-01T08:00:00.000Z; comparación exacta sobre timestamptz, sold_at
        conserva microsegundos y no se convierte a Date para agrupar; rango positivo máximo
        aceptado 366 días absolutos. metric=units|amount y direction=top|bottom obligatorios
        en este contrato; top opcional con default 5 y forma léxica exacta 5, 10 o 20
        (rechazo de 05, +5, 5.0, decimales, signos y otros enteros); method opcional
        CASH|STRIPE, omitido devuelve null. Rechaza extras, repetidos, arrays, valores vacíos y
        body no vacío. top descendente; bottom ascendente y excluye productos sin movimiento
        (unitsSold=0), no necesariamente métrica 0 si hubo unidades; el top
        mayor que el conjunto devuelve todos sin rellenar ceros; cero resultados es 200 con
        items vacío. Desempates aceptados: métrica primaria en la dirección pedida, métrica
        secundaria en la misma dirección, nombre ascendente con comparación byte a byte UTF-8
        COLLATE "C" y productId numérico ascendente. Productos dados de baja con movimiento se
        incluyen para conciliar ventas; name usa el nombre actual si deletedAt IS NULL y, en
        caso contrario, el snapshot de la línea más reciente por soldAt DESC, orderItem.id
        DESC, con nameSource. Filtrar por Product.isActive o isAvailable rompería la
        conciliación y el universo activo pertenece al contrato separado de sin movimiento.
        matchedProductCount y matchedTotals se calculan antes del corte; truncated indica si
        se omitieron productos. generatedAt no es token de snapshot compartido. Lectura
        coherente única y sumas reconciliables con /api/v1/sales/summary sobre dataset estable.
        Cache-Control no-store y Referrer-Policy no-referrer dentro del middleware privado;
        su cobertura en rechazos globales previos (Origin/parsing/413/429) no está garantizada
        con el orden actual y E2-05 debe verificarla. Errores application/problem+json saneados:
        400 VALIDATION_ERROR, 401 UNAUTHENTICATED, 403 FORBIDDEN para cualquier rol distinto de
        ADMINISTRADOR (incluido GERENTE)/PIN_CHANGE_REQUIRED/ORIGIN_NOT_ALLOWED, 413
        PAYLOAD_TOO_LARGE, 429 RATE_LIMITED, 500 INTERNAL_ERROR y 503 DEPENDENCY_UNAVAILABLE
        solo para fallos reconocidos. Sin CSRF nuevo para esta lectura ni ampliación de permisos.
      security:
        - accessCookie: []
        - productionAccessCookie: []
      parameters:
        - name: from
          in: query
          required: true
          description: Inicio UTC inclusivo, escalar único y real con 0–3 decimales; mínimo aceptado 2000-01-01T08:00:00.000Z, menor devuelve 400 sin truncar. Comparación exacta sobre timestamptz; las filas de sold_at conservan microsegundos.
          schema:
            $ref: '#/components/schemas/DashboardRankingInputInstant'
        - name: to
          in: query
          required: true
          description: Fin UTC exclusivo, escalar único y real con 0–3 decimales; estrictamente mayor que from y rango máximo aceptado de 366 días absolutos. Venta en to−1 µs incluida; filas sin truncar a milisegundos.
          schema:
            $ref: '#/components/schemas/DashboardRankingInputInstant'
        - name: metric
          in: query
          required: true
          description: Métrica de orden y de los valores por producto. No tiene default en este contrato.
          schema:
            type: string
            enum:
              - units
              - amount
        - name: direction
          in: query
          required: true
          description: top ordena descendente; bottom ascendente y excluye productos sin movimiento (unitsSold=0).
          schema:
            type: string
            enum:
              - top
              - bottom
        - name: top
          in: query
          required: false
          description: Número máximo de productos devueltos; omitido equivale a 5. Forma léxica exacta 5, 10 o 20; se rechazan 05, +5, 5.0, decimales, signos y otros enteros.
          schema:
            type: string
            enum:
              - '5'
              - '10'
              - '20'
            default: '5'
        - name: method
          in: query
          required: false
          description: Filtro opcional por método de pago; omitido incluye CASH y STRIPE y devuelve method null. No acepta vacío ni null literal.
          schema:
            type: string
            enum:
              - CASH
              - STRIPE
