        reembolso; Refund no borra la venta ni resta movimiento. Ventas fuera del rango u
        otro método no cuentan; por tanto la lista significa «sin movimiento en el rango/
        método», nunca ausencia global ni producto nunca vendido. Órdenes sin Sale
        (pendientes/fallidas/expiradas), intentos, eventos e incidentes no cuentan. Igual
