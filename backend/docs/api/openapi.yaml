    DashboardComparisonMetric:
      type: object
      additionalProperties: false
      description: >-
        Comparación propuesta contra el periodo anterior de igual duración. change y previous son
        cadenas enteras; changePercent es porcentaje con dos decimales o null si previous=0.
      properties:
        previous:
          type: string
          pattern: ^(0|[1-9][0-9]{0,18})$
        change:
          type: string
          pattern: ^(0|[1-9][0-9]{0,18}|-[1-9][0-9]{0,18})$
        changePercent:
          type: string
          nullable: true
          pattern: ^(?:(?:0|[1-9][0-9]*)\.[0-9]{2}|-(?:0\.(?:0[1-9]|[1-9][0-9])|[1-9][0-9]*\.[0-9]{2}))$
          description: >-
            Variación porcentual redondeada a dos decimales, mitades hacia arriba; null si la base
            anterior es cero (la interfaz muestra «Sin comparación»).
      required:
        - previous
        - change
        - changePercent
