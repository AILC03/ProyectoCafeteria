  /api/v1/orders:
    post:
      tags:
        - Orders
      operationId: createMobileOrder
      summary: createMobileOrder
      description:
        'Invitado o CLIENTE, nunca personal. Requiere Origin exacto y bootstrap CSRF incluso
        invitado. Si hay cookie de acceso se valida; no se permite omitir sesión inválida como
        invitado. Cliente se asocia desde sesión, no desde body; guestName solo invitado. CASH o
        STRIPE fijo. Backend calcula catálogo bajo lock (2026,1), valida disponibilidad y selección;
        snapshots inmutables. 1–50 líneas, 1–99 unidades; total <=9999900. Folio A+identity
        (ADR0011), no permiso. PENDIENTE_PAGO con plazo 30 min; La creación no cobra: Checkout se
        solicita aparte y worker realiza expiración. includeCashQr=true solo CASH añade cashQr junto
        a data; requiere cifrado configurado. Reintentos conservan QR/plazo originales por 48h,
        incluso tras pago/vencimiento, pero escaneo rechaza QR no cobrable. Sin el flag no se emite
        QR y se conserva la respuesta anterior. Nunca usar QR para consultar estado.'
      security:
        - csrfHeader: []
      parameters:
        - &a16
          name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          description:
            UUID v4 aleatorio por operación. Alcance por ruta y actor (usuario o invitado). Hash de
            entrada canónica validada; repetir devuelve mismo 201 y cuerpo original por 48h, incluso
            si catálogo/estado cambia; otra entrada 409. Después de 48h es una operación nueva. No
            concede consultas. No registrar en logs.
      responses:
        '201':
          description: 'Resultado correcto; sin efectos de pago. Cache-Control: no-store.'
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
                  cashQr:
                    $ref: '#/components/schemas/CashPaymentQr'
                  checkout:
                    type: object
                    additionalProperties: false
                    properties:
                      purpose:
                        type: string
                        enum:
                          - STRIPE_CHECKOUT
                      token: &a71
                        type: string
                        pattern: ^[A-Za-z0-9_-]{43}$
                      expiresAt: &a58
                        type: string
                        format: date-time
                    required:
                      - purpose
                      - token
                      - expiresAt
                required:
                  - data
              example: &a20
                data:
                  id: '1'
                  folio: A000001
                  source: MOBILE
                  status: PENDIENTE_PAGO
                  paymentMethod: CASH
                  totalCents: '2000'
                  customerId: null
                  guestName: null
                  paymentExpiresAt: 2026-10-26T12:30:00.000Z
                  paidAt: null
                  readyAt: null
                  readyByEmployeeId: null
                  createdAt: 2026-10-26T12:00:00.000Z
                  items: &a17
                    - id: '1'
                      productId: '1'
                      productName: Café
                      basePriceCents: '2000'
                      unitPriceCents: '2000'
                      quantity: 1
                      lineTotalCents: '2000'
                      options: []
        '400':
          description: 'VALIDATION_ERROR: entrada, query, ID o clave inválidos; campos extra rechazados.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 'UNAUTHENTICATED: requiere sesión válida; nunca degradar sesión inválida a invitado.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: FORBIDDEN / PIN_CHANGE_REQUIRED / CSRF_INVALID / ORIGIN_NOT_ALLOWED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'NOT_FOUND: ausente, ajena/no visible o cliente no encontrado.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description:
            'ORDER_CONFLICT / IDEMPOTENCY_CONFLICT: catálogo/configuración/estado o nombre de
            confirmación incompatibles.'
