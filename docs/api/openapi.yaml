  /api/v1/stripe/webhook:
    post:
      tags:
        - FIN-01
      operationId: receiveStripeWebhook
      summary: Recibir evento firmado Stripe
      description: Cuerpo raw antes del parser JSON y sin cookies/CSRF. Firma Stripe-Signature
        obligatoria. Guarda evento y job antes de 200; duplicados seguros. No llama proveedor dentro
        de la transacción. Payload normalizado no conserva datos de tarjeta/cliente. Solo
        checkout.session.completed y checkout.session.expired se procesan; otros se ignoran.
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: *a60
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Evento persistido o duplicado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  received:
                    type: boolean
                required:
                  - received
        '400':
          description: Firma/cuerpo inválido
        '503':
          description: Proveedor/configuración o persistencia indisponible; reintentar
