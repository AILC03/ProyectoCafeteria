        token de registro si invitado, todo atómico. No recotiza catálogo. Orden
        pagada/expirada/STRIPE o caja cerrada 409; ajena 403. Sin clave cifrado de tickets, invitado
        503 y rollback. Ticket se obtiene aparte por ruta protegida, nunca token en respuesta
        idempotente. Idempotency-Key UUID v4 obligatorio, por usuario/operación, 48h; replay
        devuelve resultado público original incluso tras cierre sin repetir efectos; cuerpo distinto
