  /api/v1/orders/{id}/checkout:
    post:
      tags:
        - FIN-01
      summary: createStripeCheckout
      description:
        Solo CLIENTE propietario de orden STRIPE pendiente. Reutiliza intento persistente con
        clave Stripe estable; HTTP proveedor fuera de transacciones. Incertidumbre no crea segundo
        intento. Invitado recibe permiso limitado checkout al crear orden STRIPE, en
        X-Checkout-Token; no permite consultar estado. Idempotency-Key UUID v4 obligatoria. Entradas
        estrictas; rechaza campos y query extra. Respuestas privadas no-store. Origin exacto y
        X-CSRF-Token obligatorios.
      operationId: createStripeCheckout
      security:
        - accessCookie: []
          csrfHeader: []
        - checkoutToken: []
          csrfHeader: []
        - productionAccessCookie: []
          csrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: *a59
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    properties:
                      paymentId: *a59
                      checkoutSessionId: *a60
                      url:
                        type: string
                        format: uri
                      expiresAt: *a58
                    required:
