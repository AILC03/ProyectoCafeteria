      description: 'Desarrollo: JWT HttpOnly, máximo 15 min. No Bearer.'
    productionAccessCookie:
      type: apiKey
      in: cookie
      name: __Host-caf_access
      description: 'Producción: Secure, HttpOnly, Path=/, host-only.'
    csrfHeader:
