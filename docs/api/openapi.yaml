  /api/v1/customer-registration/ticket:
    post:
      tags:
        - CustomerRegistration
      operationId: registerCustomerFromTicket
      summary: Registrar cliente exclusivamente mediante QR de compra pagada de invitado
      description:
        'Público para invitado con Origin exacto y CSRF prelogin (GET /auth/csrf). No admite
        cookies de acceso/refresh ni un registro libre sin token. Comparar SHA-256 del original,
        bloquear token→venta→orden/pago y serializar teléfono; validar no usado, plazo y coherencia
        de pago SUCCEEDED/confirmado MXN con orden EN_PREPARACION/LISTO pagada, cliente NULL,
        referencias/total/método iguales. Cuenta CLIENTE/CUSTOMER, asociación solo de esa compra y
        consumo usedAt/usedBy se realizan en una transacción; conservar snapshots y hash, purgar
        cifrado al consumir. Vence al menor de expiresAt y pago+24h, revalidado tras hash de NIP.
        Teléfono existente 409 sin consumir token. Dos solicitudes simultáneas: una 201, las demás
        409 usado. No hay replay de respuesta con identidad ni Idempotency-Key requerido. Sin
        cookies/JWT/login, IDs internos ni secretos en respuesta. QR no concede consultas de
        compras. Tras alta, iniciar sesión por flujo existente; ante respuesta perdida, no crear
        otra cuenta. No implementa Stripe, correo, recuperación ni historial.'
      security:
        - csrfHeader: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCustomerRegistration'
            example:
              token: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
              name: Ana López
              phone: '6641234567'
              pin: '0007'
      responses:
        '201':
          description:
            Cliente creado, compra del QR asociada y token consumido. Sin sesión automática ni
            Set-Cookie. Cache-Control:no-store, Referrer-Policy:no-referrer.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/RegisteredTicketCustomer'
                required:
                  - data
              example:
                data:
                  customer:
                    customerNumber: C000123
                    name: Ana López
                    phone: '+526641234567'
        '400':
          description:
            'VALIDATION_ERROR: estructura/forma inválida, campos extra, NIP, teléfono o nombre
            inválidos.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description:
            'CSRF_INVALID / FORBIDDEN / ORIGIN_NOT_ALLOWED: bootstrap CSRF y Origin exacto; solo
            invitado, sin cookie de acceso/refresh.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description:
            'REGISTRATION_TOKEN_INVALID: código inexistente/no válido para este propósito. No
            revelar identificadores.'
