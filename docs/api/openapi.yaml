        '429':
          description: RATE_LIMITED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Límite de solicitudes
                status: 429
                detail: No se pudo completar la operación.
                instance: /api/v1/products/10/options
                code: RATE_LIMITED
                requestId: req_abc123
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: DEPENDENCY_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Servicio indisponible
                status: 503
                detail: No se pudo completar la operación.
                instance: /api/v1/products/10/options
                code: DEPENDENCY_UNAVAILABLE
                requestId: req_abc123
  /api/v1/auth/csrf:
    get:
      tags:
        - Auth
      operationId: bootstrapCsrf
      summary: Bootstrap prelogin o contexto de familia; token firmado con TTL de 1 hora. No concede acceso.
      description: Bootstrap prelogin o contexto de familia; token firmado con TTL de 1 hora. No concede acceso.
      security: []
      parameters: []
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    properties:
                      csrfToken:
                        type: string
                        minLength: 1
                        maxLength: 1024
                    required:
                      - csrfToken
                required:
                  - data
              example:
                data:
                  csrfToken: example-only-not-a-real-token
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store para auth y administración.
            Set-Cookie:
              schema:
                type: string
              description:
                Cookies HttpOnly, SameSite=Lax; Secure y prefijo __Host- en producción. Access <=15min;
                refresh sujeto al vencimiento absoluto; tokens no en JSON.
        '400':
          description: VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: UNAUTHENTICATED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: FORBIDDEN / CSRF_INVALID / PIN_CHANGE_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: CONFLICT / REFRESH_ALREADY_ROTATED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: PAYLOAD_TOO_LARGE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: RATE_LIMITED / AUTH_RATE_LIMITED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: INTERNAL_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: DEPENDENCY_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
