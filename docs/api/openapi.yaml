      operationId: loginStaff
      summary: Usuario y contraseña Argon2id; 5 fallos/15min, bloqueo 15min y límite IP persistente.
        Sesión absoluta 8h.
      description:
        Usuario y contraseña Argon2id; 5 fallos/15min, bloqueo 15min y límite IP persistente.
        Sesión absoluta 8h.
      security: &a5
        - csrfHeader: []
      parameters: []
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
              example:
                data:
                  user: &a6
                    id: '1'
                    name: Usuario de ejemplo
                    role: ADMINISTRADOR
                    accountType: STAFF
                    mustChangePin: false
                  csrfToken: example-only-not-a-real-token
          headers:
