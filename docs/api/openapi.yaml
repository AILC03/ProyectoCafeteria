      tags:
        - Auth
      operationId: logoutSession
      summary:
        Idempotente con CSRF válido; revoca familia actual si existe y limpia cookies. No revoca
        otros dispositivos.
      description: Idempotente con CSRF válido; revoca familia actual si existe y limpia cookies. No
        revoca otros dispositivos.
      security: *a5
      parameters: []
      responses:
        '204':
          description: Operación completada sin cuerpo.
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store para auth y administración.
            Set-Cookie:
