tags:
  - name: Auth
    description: Autenticación y recuperación.
  - name: Catalog
    description: Productos, categorías y personalizaciones.
  - name: Orders
    description: Creación y preparación de pedidos.
  - name: Payments
    description: Cobros y confirmación Stripe.
  - name: Cash
    description: Apertura y cierre de caja.
  - name: Customers
    description: Registro por ticket, historial y favoritos.
  - name: Admin
    description: Administración protegida, solo disponibilidad admite CAJERO.
components:
  responses:
    ForbiddenOrigin:
      description: ORIGIN_NOT_ALLOWED. El origen no coincide con FRONTEND_ORIGIN.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: PAYLOAD_TOO_LARGE. Cuerpo JSON superior a 256 KiB.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: INTERNAL_ERROR. Respuesta saneada sin SQL, stack ni secretos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Category:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id: &a24
          type: string
          pattern: ^[0-9]+$
          example: '10'
        name:
          type: string
          example: Cafés
    Product:
      type: object
      additionalProperties: false
      required:
        - id
        - categoryId
        - name
        - description
        - basePriceCents
        - imageUrl
        - isAvailable
      properties:
        id: *a24
        categoryId:
          type: string
          pattern: ^[0-9]+$
          example: '1'
        name:
          type: string
          example: Latte
        description:
          type: string
          nullable: true
          example: null
        basePriceCents:
          type: string
          pattern: ^[0-9]+$
          example: '6500'
        imageUrl:
          type: string
          format: uri
          nullable: true
          example: null
        isAvailable:
          type: boolean
          example: true
    OptionValue:
      type: object
      required:
        - id
        - name
        - surchargeCents
        - isAvailable
      additionalProperties: false
      properties:
        id: *a24
        name:
          type: string
          example: Leche de almendra
        surchargeCents:
          type: string
          pattern: ^[0-9]+$
          example: '1000'
        isAvailable:
          type: boolean
          example: true
    OptionGroup:
      type: object
      required:
        - id
        - name
        - pricingScope
        - minSelections
        - maxSelections
        - values
      additionalProperties: false
      properties:
        id: *a24
        name:
          type: string
          example: Leche
        pricingScope:
          type: string
          enum:
            - GLOBAL
            - PER_PRODUCT
        minSelections:
          type: integer
          minimum: 0
        maxSelections:
          type: integer
          minimum: 0
        values:
          type: array
          items:
            $ref: '#/components/schemas/OptionValue'
    Page:
      type: object
      required:
        - limit
        - nextCursor
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        nextCursor:
          type: string
          nullable: true
          description:
            Cursor opaco base64url emitido por servidor; usarlo sin interpretar. Corresponde a los
            filtros de la solicitud original.
          example: null
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - requestId
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          example: VALIDATION_ERROR
        requestId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    AuthUser:
      type: object
      additionalProperties: false
      properties:
        id: *a15
        name:
          type: string
          minLength: 1
          maxLength: 120
        role:
          type: string
          enum:
            - CLIENTE
            - CAJERO
            - PREPARACION
            - ADMINISTRADOR
        accountType:
          type: string
          enum:
            - STAFF
            - CUSTOMER
        mustChangePin: &a25
          type: boolean
      required:
        - id
        - name
        - role
        - accountType
        - mustChangePin
    AuthSessionResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          type: object
          additionalProperties: false
          properties:
            user:
              $ref: '#/components/schemas/AuthUser'
            csrfToken:
              type: string
              minLength: 1
              maxLength: 1024
          required:
            - user
            - csrfToken
      required:
        - data
    StaffLogin:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 24
        password:
          type: string
          minLength: 8
          maxLength: 24
          writeOnly: true
      required:
        - username
        - password
    CustomerLogin:
      type: object
      additionalProperties: false
      properties:
        identifier:
