            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description:
            REGISTRATION_TOKEN_USED / REGISTRATION_TOKEN_EXPIRED / REGISTRATION_PURCHASE_INELIGIBLE
